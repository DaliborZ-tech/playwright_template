[project]
name = "playwright-tests"
version = "0.1.0"
description = "Playwright testy vlastní aplikace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "playwright==1.64.1", "pytest==9.2.0", "pytest-playwright==0.10.0",
  "pytest-html==4.2.0", "python-dotenv==1.2.4", "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --browser chromium --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure --output=reports/artifacts"
markers = [
  "smoke: rychlá kontrola základních funkcí",
  "regression: regresní scénáře",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "venv", ".tools", "reports", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
